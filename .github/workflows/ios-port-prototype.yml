name: iOS Port Prototype

on:
  workflow_dispatch:
  push:
    branches:
      - ios-port-prototype
    paths:
      - "ios/**"
      - "docs/IOS_PORTING.md"
      - ".github/workflows/ios-port-prototype.yml"

concurrency:
  group: ios-port-prototype-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ios-shell:
    name: Build iOS shell, ARM64 probe, and Zydis
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml --project ios

      - name: Build iPhone app shell (unsigned)
        run: |
          xcodebuild \
            -project ios/KytyPS5-iOS.xcodeproj \
            -scheme KytyPS5-iOS \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Configure native iOS ARM64 C++ probe
        run: |
          cmake -S ios/port-probe \
            -B build/ios-arm64-probe \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY

      - name: Compile native iOS ARM64 C++ probe
        run: cmake --build build/ios-arm64-probe --config Release

      - name: Configure pinned Zydis decoder for iOS ARM64
        run: |
          cmake -S ios/port-dependencies \
            -B build/ios-zydis \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY

      - name: Compile pinned Zydis decoder for iOS ARM64
        run: cmake --build build/ios-zydis --config Release

      - name: Configure first x86-64 interpreter core for iOS ARM64
        run: |
          cmake -S ios/arm64-core \
            -B build/ios-arm64-core \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY

      - name: Compile first x86-64 interpreter core for iOS ARM64
        run: cmake --build build/ios-arm64-core --config Release

      - name: Configure host-side interpreter tests
        run: cmake -S ios/arm64-core/tests -B build/ios-core-tests -DCMAKE_BUILD_TYPE=Release

      - name: Build host-side interpreter tests
        run: cmake --build build/ios-core-tests --config Release

      - name: Run interpreter unit tests
        run: ctest --test-dir build/ios-core-tests --build-config Release --output-on-failure

      - name: Package app bundle for inspection
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/KytyPS5.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" build/KytyPS5-unsigned-app.zip

      - name: Upload unsigned app bundle
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-iOS-unsigned-shell
          path: build/KytyPS5-unsigned-app.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload ARM64 probe library
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-iOS-ARM64-probe
          path: build/ios-arm64-probe/Release-iphoneos/libkyty_ios_arm64_probe.a
          if-no-files-found: error
          retention-days: 7

      - name: Upload ARM64 interpreter library
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-iOS-ARM64-interpreter
          path: build/ios-arm64-core/Release-iphoneos/libkyty_ios_x64_interpreter.a
          if-no-files-found: error
          retention-days: 7
